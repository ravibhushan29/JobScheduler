[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobscheduler-client"
version = "5.0.0"
description = "Python client for the Job Scheduler API (v1): submit, wait, stream, schedules, workflows, webhook verification."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27,<1"]

[tool.setuptools]
packages = ["jobscheduler_client"]
