# ---------------------------------------------------------------------------
# Development overrides. `docker compose up` merges this file automatically;
# production-like runs pass `-f docker-compose.yml` so it is ignored.
#
#   * one replica of each app service, so logs are easy to follow;
#   * the source tree is bind-mounted and the API hot-reloads;
#   * logs are human-readable text instead of JSON.
# Restart workers/scheduler after editing task code:
#   docker compose restart worker worker_long scheduler
# ---------------------------------------------------------------------------

x-dev: &dev
  volumes:
    - .:/code
  environment:
    LOG_FORMAT: text
  deploy:
    replicas: 1

services:
  api:
    <<: *dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: !override
      - "${API_PORT:-8000}:8000"
  worker: *dev
  worker_long: *dev
  scheduler: *dev
  migrate:
    volumes:
      - .:/code
