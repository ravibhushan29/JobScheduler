[project]
name = "job-scheduler"
version = "5.0.0"
description = "Highly available FastAPI + Celery + Redis + Postgres job scheduler where every job and scheduled run executes exactly once."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# B008: FastAPI's Query()/Body()/Security() defaults are the documented idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff.format]
# Code blocks in docs/*.md are hand-aligned examples, not source files.
exclude = ["*.md"]
