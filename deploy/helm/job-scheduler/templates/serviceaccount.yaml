{{- if .Values.serviceAccount.create }}
# The app never talks to the Kubernetes API, so it gets no token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "job-scheduler.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "job-scheduler.labels" . | nindent 4 }}
  {{- with (merge (dict) (.Values.serviceAccount.annotations | default dict) (.Values.commonAnnotations | default dict)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
