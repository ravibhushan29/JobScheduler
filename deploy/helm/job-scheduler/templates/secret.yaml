{{- if not .Values.secrets.existingSecret }}
# Created only when secrets.existingSecret is empty. Empty values are left out.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "job-scheduler.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "job-scheduler.labels" . | nindent 4 }}
  {{- include "job-scheduler.commonAnnotations" . }}
type: Opaque
{{- $data := dict }}
{{- range $k, $v := .Values.secrets.values }}
{{- if $v }}{{- $_ := set $data $k ($v | toString | b64enc) }}{{- end }}
{{- end }}
{{- if $data }}
data:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- else }}
data: {}
{{- end }}
{{- end }}
