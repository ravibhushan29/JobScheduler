{{- if and .Values.ingress.enabled .Values.api.enabled }}
{{- $ctx := dict "root" . "name" "api" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "job-scheduler.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "job-scheduler.componentLabels" $ctx | nindent 4 }}
  {{- with (merge (dict) (.Values.ingress.annotations | default dict) (.Values.commonAnnotations | default dict)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "job-scheduler.componentName" $ctx }}
                port:
                  name: http
{{- end }}
