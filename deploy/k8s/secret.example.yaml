# NOT applied by kustomization.yaml — create the real Secret yourself, ideally
# from a secret manager (External Secrets Operator, Sealed Secrets, Vault):
#
#   kubectl -n job-scheduler create secret generic job-scheduler-secrets \
#     --from-literal=DATABASE_URL='postgresql://jobs:...@db.internal:5432/jobs?sslmode=require' \
#     --from-literal=CELERY_BROKER_URL='rediss://:...@redis.internal:6379/0' \
#     --from-literal=API_KEYS='key-1,key-2' \
#     --from-literal=FLOWER_BASIC_AUTH='admin:...'
apiVersion: v1
kind: Secret
metadata:
  name: job-scheduler-secrets
  namespace: job-scheduler
type: Opaque
stringData:
  DATABASE_URL: postgresql://jobs:CHANGE_ME@postgres.example.internal:5432/jobs?sslmode=require
  # Managed Redis with failover, or Sentinel:
  #   sentinel://:pass@s1:26379;sentinel://:pass@s2:26379  (+ REDIS_SENTINEL_MASTER in the ConfigMap)
  CELERY_BROKER_URL: rediss://:CHANGE_ME@redis.example.internal:6379/0
  API_KEYS: CHANGE_ME
  FLOWER_BASIC_AUTH: admin:CHANGE_ME
